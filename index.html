<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Surprise! 😂</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            color: #333;
            min-height: 100vh;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff4757;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #555;
            margin-bottom: 15px;
        }
        .image-box img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid #eee;
            background: #fff;
        }
        .footer-note {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
        .counter-box {
            margin-top: 15px;
            font-size: 14px;
            color: #444;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>হা হা! ধরা খেয়ে গেছেন! 😂</h1>
        <p>আপনি যাকে খুঁজছেন সে এই মুহূর্তে একটু ব্যস্ত আছে, তাই তার বদলে আপনাকে স্বাগতম!</p>
        
        <!-- গাধার আসল ছবি -->
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1557431175-36427d1a499e?w=800&auto=format&fit=crop&q=80" alt="Donkey Prank">
        </div>

        <div class="footer-note">
            <p>চমকে যাওয়ার জন্য ধন্যবাদ! 😉</p>
        </div>

        <!-- ভিউ কাউন্টার -->
        <div class="counter-box">
            👀 মোট ভিজিট করেছে: <span id="view-count">3</span> বার
        </div>
    </div>

    <script>
        let views = localStorage.getItem('prank_views_count');
        if (!views) {
            views = 3;
        } else {
            views = parseInt(views) + 1;
        }
        localStorage.setItem('prank_views_count', views);
        document.getElementById('view-count').innerText = views;
    </script>

</body>
</html>
