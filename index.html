<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Surprise! 😂</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 50px 20px;
            color: #333;
            min-height: 100vh;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff4757;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }
        .image-box img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #eee;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>হা হা! ধরা খেয়ে গেছেন! 😂</h1>
        <p>আপনি যাকে খুঁজছেন সে এই মুহূর্তে একটু ব্যস্ত আছে, তাই তার বদলে আপনাকে স্বাগতম!</p>
        
        <!-- গাধার ছবি -->
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1562564055-71e051d33c19?w=600&auto=format&fit=crop&q=80" alt="Donkey">
        </div>

        <div class="footer-note">
            <p>চমকে যাওয়ার জন্য ধন্যবাদ! 😉</p>
        </div>
    </div>

</body>
</html>
