<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oops! Surprise! 😂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            color: #333;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ff4757;
            font-size: clamp(24px, 5vw, 38px);
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 20px;
        }

        .image-box {
            width: 100%;
            margin: 20px auto;
        }

        .image-box img {
            display: block;
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #eee;
            background: #fff;
        }

        .footer-note {
            margin-top: 15px;
        }

        .counter-box {
            margin-top: 20px;
            font-size: 17px;
            color: #444;
            background: #f8f9fa;
            padding: 12px 18px;
            border-radius: 12px;
            display: inline-block;
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 15px;
            }

            .container {
                padding: 25px 18px;
                border-radius: 24px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>হা হা! ধরা খেয়ে গেছেন! 😂</h1>

        <p>
            আপনি যাকে খুঁজছেন সে এই মুহূর্তে একটু ব্যস্ত আছে,
            তাই তার বদলে আপনাকে স্বাগতম!
        </p>

        <!-- মজাদার বানরের ছবি -->
        <div class="image-box">
            <img
                src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=800&auto=format&fit=crop&q=80"
                alt="Funny Monkey Prank"
                loading="eager"
            >
        </div>

        <div class="footer-note">
            <p>চমকে যাওয়ার জন্য ধন্যবাদ! 😉</p>
        </div>

        <!-- ব্রাউজারভিত্তিক ভিউ কাউন্টার -->
        <div class="counter-box">
            👀 মোট ভিজিট করেছে:
            <span id="view-count">0</span> বার
        </div>

    </div>

    <script>
        const counterKey = 'prank_views_count';

        let views = Number(localStorage.getItem(counterKey)) || 0;

        views++;

        localStorage.setItem(counterKey, views);

        document.getElementById('view-count').textContent = views;
    </script>

</body>
</html>
